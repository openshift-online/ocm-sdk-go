name: Auto-tag and release on version bump

on:
  push:
    branches:
      - main
    paths:
      - 'version.go'

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  auto-tag-and-release:
    name: Create release tag and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from version.go
        id: version
        run: |
          VERSION=$(grep 'const Version = ' version.go | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extracted version: v${VERSION}"

      - name: Validate version is new
        id: validate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Check if tag already exists
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} already exists, skipping release"
            exit 0
          fi

          # Validate version format (v0.1.XXX or v0.1.XXX-test)
          if ! echo "${VERSION}" | grep -qE '^v0\.1\.[0-9]+(-test)?$'; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Invalid version format: ${VERSION}"
            exit 0
          fi

          echo "is_new=true" >> "$GITHUB_OUTPUT"
          echo "Version ${VERSION} is valid and new"

      - name: Create tag
        if: steps.validate.outputs.is_new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Setup Python
        if: steps.validate.outputs.is_new == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python modules
        if: steps.validate.outputs.is_new == 'true'
        run: pip install -r .github/workflows/requirements.txt

      - name: Create release
        if: steps.validate.outputs.is_new == 'true'
        shell: python
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os
          import requests

          version_tag = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          token = os.environ["TOKEN"]

          version = version_tag.lstrip("v")

          body = ""
          with open("CHANGES.md", "r") as stream:
              while True:
                  line = stream.readline()
                  if line == "" or line.startswith("## " + version):
                      break
              while True:
                  line = stream.readline()
                  if line == "" or line.startswith("## "):
                      break
                  body += line

          response = requests.post(
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              json={
                  "tag_name": version_tag,
                  "name": f"Release {version}",
                  "body": body,
              },
              url=(
                  "https://api.github.com"
                  f"/repos/{repository}/releases"
              ),
              timeout=(10, 30),
          )
          response.raise_for_status()
